name: "Arduino pipeline"
on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main", "stage" ]

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Code spell
      uses: codespell-project/actions-codespell@v2
      #with:
      #  only_warn: 1
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        uses: arduino/arduino-lint-action@v2
        with: 
          compliance: specification #strict
  whisper:
    runs-on: ubuntu-latest
    steps:
      - name: install whispers
        run: pip3 install whispers 
      
      - name: run whispers
        run: whispers .
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fqbn: 
        - esp32:esp32:esp32s3
    steps:
    - uses: actions/checkout@v4
    - uses: arduino/compile-sketches@v1
      with:
        fqbn: ${{ matrix.fqbn }}
        github-token: ${{ secrets.GH_ACTIONS }}
        platforms: |
          - name: esp32:esp32
            source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
        sketch-paths: |
          - ../
        libraries: |
          - name: "Adafruit SSD1306"
        enable-deltas-report: true
